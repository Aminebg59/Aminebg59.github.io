<div class="main">

    <h1>Bienvenue dans l'univers Nintendo et Zelda</h1>

    <p>
        Ce site présente l'univers de Nintendo et la célèbre saga
        The Legend of Zelda.
    </p>

    <!-- IMAGES -->
    <img src="images/nintendo1.jpg" alt="Console Nintendo Switch">
    <img src="images/zelda1.jpg" alt="Link dans Zelda">
    <img src="images/zelda2.jpg" alt="Breath of the Wild">
    <img src="images/nintendo2.jpg" alt="Manette Nintendo">

    <!-- MUSIQUE -->
    <h2>Musique de fond</h2>

    <audio id="musique" src="musique.mp3"></audio>

    <button onclick="document.getElementById('musique').play()">Play</button>
    <button onclick="document.getElementById('musique').pause()">Pause</button>
    <button onclick="stopMusic()">Stop</button>

</div>

<!-- SCRIPT STOP -->
<script>
    function stopMusic() {
        var audio = document.getElementById("musique");
        audio.pause();
        audio.currentTime = 0;
    }
</script>

</body>
